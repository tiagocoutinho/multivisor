name: CI

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.1
          environments: test
          cache: true

      # TODO: add isort and flake8 when they will start passing

      - name: Test
        run: pixi run -e test test
