<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background badge -->
  <rect x="0.5" y="0.5" width="23" height="23" rx="5.5" fill="#3B4252"/>

  <!-- Spokes from hub to each node -->
  <g stroke="#8FA1FF" stroke-width="1.6" stroke-linecap="round">
    <line x1="12" y1="12" x2="6" y2="6"/>
    <line x1="12" y1="12" x2="18" y2="6"/>
    <line x1="12" y1="12" x2="6" y2="18"/>
    <line x1="12" y1="12" x2="18" y2="18"/>
  </g>

  <!-- Satellite nodes (supervised processes) -->
  <g fill="#8FA1FF">
    <circle cx="6" cy="6" r="2.1"/>
    <circle cx="18" cy="6" r="2.1"/>
    <circle cx="6" cy="18" r="2.1"/>
    <circle cx="18" cy="18" r="2.1"/>
  </g>

  <!-- Central hub (the supervisor) -->
  <circle cx="12" cy="12" r="3.4" fill="#FFFFFF"/>
  <circle cx="12" cy="12" r="3.4" fill="none" stroke="#3B4252" stroke-width="0.6"/>
</svg>
